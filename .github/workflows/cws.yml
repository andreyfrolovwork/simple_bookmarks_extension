name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      publish:
        description: After upload, submit the draft for review (goes toward publish)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: chrome-webstore
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run store:pack
      - name: Upload zip as a Chrome Web Store draft
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@4 upload \
            --source bookmark-manager.zip \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"
      - name: Submit draft for review
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@4 publish \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"
